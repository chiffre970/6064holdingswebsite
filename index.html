<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="6064 Holdings, the holding company of a gamified online retail site.">
  <title>6064 Holdings</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="animation.js" defer></script>
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark" aria-label="6064 Holdings">
      <span class="wordmark__number" aria-hidden="true">6064</span>
      <span class="wordmark__name" aria-hidden="true">HOLDINGS</span>
    </h1>
  </header>

  <main class="stage">
    <figure class="figure" aria-label="A slowly rotating ASCII pyramid">
      <pre class="pyramid-fallback" aria-hidden="true">                        :
                        :
                       ::.
                       ::.
                      :::..
                     :::...
                     :::....
                    ::::.....
                    ::::.....
                   :::::......
                  ::::::......
                  ::::::.......
                 :::::::.......
                 :::::::........
                :::::::.........
                :::::::..........
               ::::::::...........
               ::::::::...........
              :::::::::...........
              :::::::::............
               ::::::::............
                  :::::.........
                     :..</pre>
      <canvas class="pyramid-canvas" id="pyramid-canvas" width="460" height="440" aria-hidden="true" hidden></canvas>
    </figure>
  </main>
</body>
</html>
