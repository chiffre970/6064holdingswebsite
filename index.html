<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="6064 Holdings, the holding company of a gamified online retail site.">
  <title>6064 Holdings</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="animation.js" defer></script>
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark" aria-label="6064 Holdings">
      <span class="wordmark__number" aria-hidden="true">6064</span>
      <span class="wordmark__name" aria-hidden="true">HOLDINGS</span>
    </h1>
  </header>

  <main class="stage">
    <figure class="figure">
      <pre class="ascii-cube" id="ascii-cube" aria-hidden="true">




                   +---
                  /|  ------
                // |       ------
               //  |            ------
              //   |                  -----
             /     |                       --+
           //      |                      ---|
          //       |                   ---   ||
         +/--      |                ---       |
         |   ------|              ---         |
         |         |-------    ---            |
         |         |      ---+-               ||
        |          |         |                 |
        |          |         |                 |
        |          |         |                 |
        |          |         |                  |
        |          |         |                  |
        |          |          |                 |
       ||          |          |                 |
       |         --+---------------              |
       |   ------             |   ---------------+
       +-----------           |    ----------
                   -----------+-----



      </pre>
      <figcaption class="caption">
        <p class="formula">
          <span aria-hidden="true">6064 / 4813 ≈ ∛2</span>
          <span class="visually-hidden">6064 divided by 4813 is approximately the cube root of two.</span>
        </p>
        <p class="statement">A change in scale. Twice the volume.</p>
        <p class="visually-hidden">A slowly rotating ASCII wireframe cube breathes from one unit to approximately 1.26 units in edge length, doubling its volume.</p>
      </figcaption>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-controls="ascii-cube" hidden>
        Pause animation
      </button>
    </figure>
  </main>

  <footer class="footer">
    <p>6064 Holdings</p>
    <p class="footer__aside">Independent online retail.</p>
  </footer>
</body>
</html>
